services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nichegpt
    ports:
      - "5432:5432"
    volumes:
      - nichegpt_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "8100:8100"
    depends_on:
      - postgres

volumes:
  nichegpt_pg:
